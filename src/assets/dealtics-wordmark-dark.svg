  <line x1="20"  y1="60"  x2="220" y2="60"  stroke="white" stroke-width="0.8" opacity="0.10"/>
  <line x1="20"  y1="110" x2="220" y2="110" stroke="white" stroke-width="0.8" opacity="0.10"/>
  <line x1="20"  y1="160" x2="220" y2="160" stroke="white" stroke-width="0.8" opacity="0.10"/>
