  <line x1="170" y1="10"  x2="170" y2="210" stroke="white" stroke-width="0.8" opacity="0.10"/>

  <!-- Letra D -->
  <path d="M73 52 L73 168 L97 168 C150 168 180 142 180 110 C180 78 150 52 97 52 Z"
